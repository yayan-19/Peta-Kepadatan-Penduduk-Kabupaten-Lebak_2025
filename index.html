<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 

        /* HAPUS DAN SEMBUNYIKAN ELEMEN ATTRIBUTION (qgis2web, OpenLayers, QGIS) */
        .ol-attribution,
        .ol-attribution-uncollapsible,
        .ol-attribution button,
        .ol-attribution ul,
        .ol-attribution li,
        .ol-attribution a,
        div[class*="attribution"] {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Style Running Text (Header Merah) */
        .running-text-container {
            width: 100%;
            background-color: #ff0000; /* Latar Belakang Merah */
            color: #ffffff;            /* Warna Teks Putih */
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            height: 35px;
            line-height: 35px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1000;
        }

        /* Menyesuaikan Tinggi Peta Agar Layer Tidak Tertutup Running Text */
        #map {
            width: 100%;
            height: calc(100% - 35px);
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025</title>
    </head>
    <body>
        <!-- Running Text -->
        <div class="running-text-container">
            <marquee behavior="scroll" direction="left" scrollamount="6">
                Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025
            </marquee>
        </div>

        <!-- Element Peta -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/KepadatanPendudukKabupatenLebakTahun2025_2.js"></script>
        <script src="styles/KepadatanPendudukKabupatenLebakTahun2025_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <!-- SCRIPT PENGHAPUSAN TULISAN ATRIBUT SECARA DYNAMIS -->
        <script>
            // Hapus kontrol attribution langsung dari peta OpenLayers setelah peta diinisialisasi
            function removeAttribution() {
                if (typeof map !== 'undefined') {
                    map.getControls().forEach(function(control) {
                        if (control instanceof ol.control.Attribution) {
                            map.removeControl(control);
                        }
                    });
                }
                // Hapus elemen DOM fisik jika masih tersisa
                var attributions = document.querySelectorAll('.ol-attribution, .ol-attribution-uncollapsible');
                attributions.forEach(function(el) {
                    el.remove();
                });
            }

            // Jalankan fungsi penghapusan berulang untuk memastikan tulisan hilang sepenuhnya
            window.addEventListener('load', function() {
                removeAttribution();
                var intervalId = setInterval(function() {
                    removeAttribution();
                }, 50);
                setTimeout(function() {
                    clearInterval(intervalId);
                }, 3000);
            });
        </script>
    </body>
</html>
