<!doctype html>
<html lang="id" class="notranslate" translate="no">
    <head>
        <meta charset="utf-8">
        <meta name="google" content="notranslate">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        
        <style>
        html, body {
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* --- 1. Running Text (Red Background, White Text, Not Translated) --- */
        #header-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #e60000;
            color: #ffffff;
            z-index: 1000;
            display: flex;
            align-items: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .marquee-text {
            font-size: 16px;
            font-weight: bold;
            line-height: 40px;
        }

        /* --- Container Peta (Di bawah running text) --- */
        #map {
            position: absolute;
            top: 40px;
            bottom: 0;
            width: 100%;
            height: calc(100% - 40px);
            touch-action: manipulation;
        }

        /* --- 2. HAPUS TULISAN qgis2web, OpenLayers, QGIS SECARA PERMANEN VIA CSS --- */
        .ol-attribution, 
        .ol-attribution *,
        [class*="ol-attribution"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
            width: 0 !important;
            pointer-events: none !important;
        }

        /* --- Controls Styling --- */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* --- 3. Tombol Home (Kembali ke Tampilan Awal) --- */
        .ol-home {
            top: 65px;
            left: .5em;
        }
        .ol-home button {
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* --- 4. Tampilan Loading Animation --- */
        #loader-wrapper {
            position: fixed;
            top: 40px;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            background-color: #ffffff;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e60000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }
        </style>
        <title>Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025</title>
    </head>
    <body>
        <!-- Header Running Text -->
        <div id="header-banner" class="notranslate" translate="no">
            <marquee class="marquee-text" behavior="scroll" direction="left" scrollamount="6">
                Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025
            </marquee>
        </div>

        <!-- Tampilan Loading -->
        <div id="loader-wrapper">
            <div class="spinner"></div>
            <div class="loading-text">Memuat Peta...</div>
        </div>

        <!-- Container Peta -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <!-- Resources & Libraries -->
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/KepadatanPendudukKabupatenLebakTahun2025_2.js"></script>
        <script src="styles/KepadatanPendudukKabupatenLebakTahun2025_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <script>
        // PERMANENT REMOVAL & MAP CONTROLS SCRIPT
        (function() {
            if (typeof map !== 'undefined') {
                // 1. Hapus Atribusi (qgis2web, OpenLayers, QGIS) dari objek Map OpenLayers secara langsung
                var controls = map.getControls();
                controls.forEach(function(control) {
                    if (control instanceof ol.control.Attribution) {
                        map.removeControl(control);
                    }
                });

                // 2. Kunci Rotasi Peta agar Selalu Mengarah ke Utara (Utara Tetap di Atas)
                var view = map.getView();
                view.setRotation(0);
                
                // Matikan gesture rotasi di HP/Touchscreen
                var interactions = map.getInteractions();
                interactions.forEach(function(interaction) {
                    if (interaction instanceof ol.interaction.PinchRotate) {
                        map.removeInteraction(interaction);
                    }
                });

                // 3. Tambahkan Tombol Home (Posisi rapi di bawah tombol Zoom +, -)
                var initialExtent = view.calculateExtent(map.getSize());

                var homeBtn = document.createElement('button');
                homeBtn.innerHTML = '&#8962;'; // Icon rumah
                homeBtn.title = 'Kembali ke tampilan awal';
                homeBtn.addEventListener('click', function() {
                    view.fit(initialExtent, { duration: 500 });
                });

                var homeContainer = document.createElement('div');
                homeContainer.className = 'ol-home ol-unselectable ol-control';
                homeContainer.appendChild(homeBtn);
                map.addControl(new ol.control.Control({ element: homeContainer }));
            }

            // 4. Hapus elemen atribusi yang sudah terlanjur dirender di DOM HTML
            function purgeAttributionElements() {
                var nodes = document.querySelectorAll('.ol-attribution, .ol-attribution-col, [class*="attribution"]');
                nodes.forEach(function(node) {
                    node.parentNode && node.parentNode.removeChild(node);
                });
            }

            // Jalankan penghapusan DOM & hilangkan Layar Loading
            window.addEventListener('load', function() {
                purgeAttributionElements();
                setInterval(purgeAttributionElements, 200);

                var loader = document.getElementById('loader-wrapper');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 400);
                }
            });
        })();
        </script>
    </body>
</html>
