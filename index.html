<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 

        /* HAPUS ELEMEN ATTRIBUTION (qgis2web, OpenLayers, QGIS) */
        .ol-attribution,
        .ol-attribution-uncollapsible,
        .ol-attribution button,
        .ol-attribution ul,
        .ol-attribution li,
        .ol-attribution a,
        div[class*="attribution"] {
            display: none !important;
            visibility: hidden !important;
            width: 0 !important;
            height: 0 !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Style Running Text (Header Merah) */
        .running-text-container {
            width: 100%;
            background-color: #ff0000; /* Latar Belakang Merah */
            color: #ffffff;            /* Warna Teks Putih */
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 16px;
            height: 35px;
            line-height: 35px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1000;
        }

        /* Menyesuaikan Tinggi Peta */
        #map {
            width: 100%;
            height: calc(100% - 35px);
            padding: 0;
            margin: 0;
        }

        /* STYLE TAMPILAN LOADING SCREEN */
        #loading-screen {
            position: fixed;
            top: 35px; /* Tepat di bawah running text */
            left: 0;
            width: 100%;
            height: calc(100% - 35px);
            background-color: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff0000; /* Warna Merah */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 15px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            color: #333333;
        }
        </style>
        <title>Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025</title>
    </head>
    <body>
        <!-- Running Text -->
        <div class="running-text-container">
            <marquee behavior="scroll" direction="left" scrollamount="6">
                Peta Kepadatan Penduduk Kabupaten Lebak Tahun 2025
            </marquee>
        </div>

        <!-- Tampilan Loading -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <div class="loading-text">Memuat Peta Kepadatan Penduduk...</div>
        </div>

        <!-- Element Peta -->
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:4326','+proj=longlat +datum=WGS84 +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/KepadatanPendudukKabupatenLebakTahun2025_2.js"></script>
        <script src="styles/KepadatanPendudukKabupatenLebakTahun2025_2_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        

        <!-- SCRIPT KHUSUS: Mengunci Rotasi, Menghapus Atribut, & Mengelola Loading -->
        <script>
            function applyMapSettings() {
                if (typeof map !== 'undefined') {
                    // 1. Kunci agar peta tidak bisa diputar (Selalu mengarah ke Utara)
                    var view = map.getView();
                    if (view) {
                        view.setRotation(0);
                    }

                    // 2. Hapus interaksi rotasi (Gestur Dua Jari & Alt+Drag)
                    map.getInteractions().forEach(function(interaction) {
                        if (interaction instanceof ol.interaction.PinchRotate || 
                            interaction instanceof ol.interaction.DragRotate) {
                            map.removeInteraction(interaction);
                        }
                    });

                    // 3. Hapus atribut qgis2web, OpenLayers, & QGIS
                    map.getControls().forEach(function(control) {
                        if (control instanceof ol.control.Attribution) {
                            map.removeControl(control);
                        }
                    });
                }

                // Hapus elemen DOM attribution jika tersisa
                var attributions = document.querySelectorAll('.ol-attribution, .ol-attribution-uncollapsible');
                attributions.forEach(function(el) {
                    el.remove();
                });
            }

            // FUNGSI UNTUK MENGHILANGKAN LOADING SCREEN
            function hideLoadingScreen() {
                var loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(function() {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }
            }

            // Jalankan konfigurasi saat halaman selesai memuat
            window.addEventListener('load', function() {
                applyMapSettings();
                var intervalId = setInterval(applyMapSettings, 50);
                setTimeout(function() {
                    clearInterval(intervalId);
                }, 3000);

                // Sembunyikan layar loading
                if (typeof map !== 'undefined') {
                    map.once('rendercomplete', function() {
                        hideLoadingScreen();
                    });
                    // Cadangan jika rendercomplete terlambat
                    setTimeout(hideLoadingScreen, 2000);
                } else {
                    hideLoadingScreen();
                }
            });
        </script>
    </body>
</html>
